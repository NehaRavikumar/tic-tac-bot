[project]
name = "tic-tac-bot"
version = "0.1.0"
description = "Vision-assisted tic-tac-toe move selector for a robot."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = []

[project.scripts]
tic-tac-bot = "tictac_bot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
